org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# FIX 1: Opt-out dari new DSL AGP 9 behavior yang belum didukung Flutter
android.newDsl=false

# FIX 2: Nonaktifkan configuration cache yang menyebabkan NullPointerException
#         dan masalah "Already watching path"
org.gradle.configuration-cache=false
org.gradle.caching=false

# FIX 3: Nonaktifkan file system watching yang menyebabkan "Already watching path"
org.gradle.vfs.watch=false

# Paralel build
org.gradle.parallel=true
org.gradle.daemon=true
