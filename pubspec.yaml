name: otax
description: "Bug WhatsApp Crasher"
publish_to: 'none'
version: 2.0.2+25

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  # Network, parsing, cryptographic deps
  http: ^1.2.2
  graphql: ^5.1.3
  html: ^0.15.6
  encrypt: ^5.0.3
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  web_socket_channel: ^2.4.0
  network_info_plus: ^4.1.0
  dio: ^5.7.0
  connectivity_plus: ^6.0.3

  # Core utils
  path_provider: ^2.1.1
  awesome_notifications: ^0.10.1
  package_info_plus: ^9.0.0
  permission_handler: ^11.3.0
  device_info_plus: ^12.3.0
  provider: ^6.1.2
  file_picker: ^10.2.0
  dynamic_color: ^1.7.0
  app_links: ^6.4.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.1.0

  # Media and player related
  open_file: ^3.5.10
  wakelock_plus: ^1.2.10
  just_audio: ^0.10.1
  video_player: ^2.9.2
  audioplayers: ^6.5.1
  chewie: ^1.5.2
  video_player_win: ^3.1.1

  # UI
  pull_to_refresh: ^2.0.0
  desktop_webview_window: ^0.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  webview_flutter: ^4.4.2
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.2
  iconsax: ^0.0.8
  carousel_slider: ^5.1.1
  flutter_cache_manager: ^3.4.1
  system_alert_window: ^2.0.0
  window_manager: ^0.3.8

  # Misc
  flutter_native_splash: ^2.4.7
  share_plus: ^7.0.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  downloadsfolder: ^1.2.0
  flutter_downloader: ^1.11.6
  percent_indicator: ^4.2.3
  flutter_foreground_task: ^9.2.0
  android_intent_plus: ^5.0.2
  fluttertoast: ^9.0.0
  image_gallery_saver_plus: ^4.0.1
  flutter_overlay_window: ^0.4.3

  # FIXED: Missing packages untuk build
  clipboard: ^0.1.3
  dartssh2: ^2.14.0
  flutter_web_auth_2: ^5.0.2
  flutter_markdown: ^0.6.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_inappwebview: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/otax.jpg
    - assets/images/ramadan_deco.png
    - assets/images/masjid_deco.png
    - assets/images/logo.jpg
    - assets/videos/otaxai.mp4
    - assets/videos/banner.mp4
    - assets/images/otaxlogo.png
    - lib/images/pacman.png
    - lib/images/ghost.png
    - lib/images/ghost2.png
    - lib/images/ghost3.png
    - assets/pacman_beginning.wav
    - assets/pacman_chomp.wav
    - assets/pacman_death.wav
    - assets/pacman_intermission.wav
    - lib/assets/images/search.png
    - lib/assets/images/broken_heart.png
    - lib/assets/images/check.png
    - lib/assets/images/ghost.png
    - lib/assets/icons/logo_foreground.png
    - lib/assets/icons/logo_monochrome.png
    - lib/assets/images/chisato.jpeg
    - lib/assets/images/mitsuha.jpg
    - lib/assets/images/profile_banner.jpg
    - lib/assets/images/chisato_AI.jpg
    - lib/assets/images/fluent_max.svg
    - lib/assets/images/fluent_min.svg
    - lib/assets/images/fluent_close.svg
    - assets/images/bedug_deco.png
    - assets/images/ketupat_deco.png

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Rajdhani-Regular.ttf

    - family: ShareTechMono
      fonts:
        - asset: fonts/Rajdhani-Regular.ttf

    - family: Debrosee
      fonts:
        - asset: fonts/Rajdhani-Regular.ttf

    - family: Aloevera
      fonts:
        - asset: fonts/Aloevera-OVoWO.ttf

    - family: Aktura
      fonts:
        - asset: fonts/Aktura-Regular.ttf

    - family: Uthmanic
      fonts:
        - asset: fonts/Uthmanic.ttf

    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Regular.ttf
          style: normal
          weight: 500
        - asset: lib/assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: lib/assets/fonts/OpenSans-Regular.ttf
          style: normal
          weight: 500
        - asset: lib/assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: lib/assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: NunitoSans
      fonts:
        - asset: lib/assets/fonts/NunitoSans_10pt-Medium.ttf
          style: normal
          weight: 500
        - asset: lib/assets/fonts/NunitoSans_10pt-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: lib/assets/fonts/NotoSans-Regular.ttf
          style: normal
          weight: 500
        - asset: lib/assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins-Bold.ttf
