name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Patch dartssh2 2.14.0 for Dart 3.9+
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/dartssh2-2.14.0/lib/src/sftp/sftp_client.dart"
          sed -i 's/if (bytessRecieved >= length)/if (length != null \&\& bytessRecieved >= length)/' "$FILE"

      - name: Show dartssh2 SFTP source
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/dartssh2-2.14.0/lib/src/sftp/sftp_client.dart"
          sed -n '570,610p' "$FILE"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASE-OTAX-APK
          path: build/app/outputs/flutter-apk/app-release.apk
